<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>步經徑</title>
  <link rel="icon" type="image/png" href="/favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/style.css">

  <!--
    這家店的設定，部署時填入。本機開發可以用網址參數覆寫後端與 Google client id
    （只在 localhost 有效，見 js/api.js 的 devParam）。

    ★ 這個檔案是「每家店不一樣」的那一份設定。每店一條 branch，差異就只有這一段
      與 <title>——店名、後端主機、部署識別、Google client id。店名放在這裡而不是
      main.js，是為了讓 js/ 底下的每一支在每條 branch 上完全相同：那些檔案會一直
      因為通用修改而改動，只要裡面還留著店名，每次把 main 合進店家分支就會撞一次
      沒有意義的衝突。
    ★ 寫成 JSON，不是一段會執行的 <script>：_headers 的 Content-Security-Policy 不准
      頁面裡有直接寫在 HTML 裡的程式（注入攻擊放程式的地方正是那裡）。type 是
      application/json 的區塊瀏覽器不會執行，由下一行的 js/site-config.js 讀出來。
    ★ 換後端主機時，_headers 的 connect-src 與 img-src 也要有那個主機，否則瀏覽器會
      擋下所有 API 請求（tests/site-config.test.mjs 會抓到）。
  -->
  <script type="application/json" id="site-config">
    {
      "__BOO_KING_KING_SITE_NAME__": "步經徑",
      "__BOO_KING_KING_API_HOST__": "https://boo-king-king-tutor-arthur-demo.onrender.com",
      "__BOO_KING_KING_VARIANT__": "tutor-arthur-demo",
      "__GOOGLE_CLIENT_ID__": "903554149397-i8l9mfpn86m3352i49472rn6fj39f0kg.apps.googleusercontent.com"
    }
  </script>
  <script src="/js/site-config.js"></script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="app" class="app"></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
