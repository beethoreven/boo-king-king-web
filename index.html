<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>步經徑</title>
  <link rel="icon" type="image/png" href="favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="style.css">

  <script>
    // 部署時填入。本機開發可以改用網址參數覆寫：
    //   ?apiBase=http://localhost:5001/v/tutor-arthur&googleClientId=xxx
    //
    // ★ 這個檔案是「每家店不一樣」的那一份設定。每店一條 branch，差異
    //   就只有這幾行——店名、主機、部署識別、Google client id。
    //
    //   店名放在這裡而不是 main.js，是為了讓 js/ 底下的每一支在兩條
    //   branch 上完全相同：那些檔案會一直因為通用修改而改動，只要裡面
    //   還留著店名，每次把 main 合進 eli 就會撞一次沒有意義的衝突。
    window.__BOO_KING_KING_SITE_NAME__ = '步經徑';
    window.__BOO_KING_KING_API_HOST__ = 'https://boo-king-king-tutor-arthur.onrender.com';
    window.__BOO_KING_KING_VARIANT__ = 'tutor-arthur';
    window.__GOOGLE_CLIENT_ID__ = '903554149397-i8l9mfpn86m3352i49472rn6fj39f0kg.apps.googleusercontent.com';
  </script>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
  <div id="app" class="app"></div>
  <script type="module" src="js/main.js"></script>
</body>
</html>
